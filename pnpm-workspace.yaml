packages:
  - "extensions/*"

catalogs:
  build:
    "@types/node": ^25.5.0
    "@types/vscode": ^1.96.0
    typescript: ^6.0.3
    tsdown: ^0.21.4
    "@vscode/vsce": ^3.2.0
    vitest: ^4.1.0

allowBuilds:
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true

# tsdown asks for typescript ^5 and only uses it to emit .d.ts files, which no
# extension here does — every build is a bundle, so the mismatch is harmless.
peerDependencyRules:
  allowedVersions:
    "tsdown>typescript": "6"


linkWorkspacePackages: true
nodeLinker: isolated
