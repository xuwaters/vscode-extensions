[package]
name = "wgsl-lsp-wasm"
version = "0.1.0"
edition = { workspace = true }
description = "wasm-bindgen surface for the WGSL/GLSL language server — the only crate in the stack that knows WASM exists."
license = "MIT"

[lib]
crate-type = [ "cdylib", "rlib" ]

[lints]
workspace = true

[dependencies]
wgsl-lsp-core = { path = "../wgsl-lsp-core" }

wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
# The artifact is around 3 MB before optimisation, which is small enough that
# the ~5 s `-Os` costs is worth paying once at `package` time.
#
# The `--enable-*` flags are not optional. Current rustc emits bulk-memory,
# sign-extension and non-trapping float-to-int instructions for
# wasm32-unknown-unknown by default, and wasm-opt refuses to validate a module
# using features it has not been told about — without them the build fails with
# "memory.fill operations require bulk memory".
wasm-opt = [
  "-Os",
  "--strip-debug",
  "--enable-bulk-memory",
  "--enable-bulk-memory-opt",
  "--enable-nontrapping-float-to-int",
  "--enable-sign-ext",
  "--enable-mutable-globals",
  "--enable-reference-types",
  "--enable-multivalue",
]
