[package]
name = "wgsl-lsp-core"
version = "0.1.0"
edition = { workspace = true }
description = "Transport-agnostic WGSL/GLSL language server — method dispatch, document state, and every IDE feature, expressed in lsp-types shapes."
license = "MIT"

[lints]
workspace = true

[dependencies]
wgsl-syntax = { path = "../wgsl-syntax" }
analyzer-core = { path = "../../analyzer-core" }

naga = { version = "30.0.1", features = [ "wgsl-in", "glsl-in" ] }
lsp-types = "0.97"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1"
