[package]
name = "capnp-analyzer"
version = "0.1.0"
edition = { workspace = true }
description = "Cap'n Proto language analyzer — parser, diagnostics — compilable to WASM for VSCode"
license = "MIT"

[lints]
workspace = true

[lib]
crate-type = [ "cdylib", "rlib" ]

[dependencies]
analyzer-core = { path = "../analyzer-core" }
rustc-hash = "2"
smol_str = "0.3"
indexmap = "2"

wasm-bindgen = "0.2"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
console_error_panic_hook = "0.1"

[dev-dependencies]
pretty_assertions = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
