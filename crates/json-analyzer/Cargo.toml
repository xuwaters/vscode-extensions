[package]
name = "json-analyzer"
version = "0.1.0"
edition = { workspace = true }
description = "JSON / JSONC / JSON5 / JSON Lines analyzer — lossless parser, diagnostics, comment-preserving formatter, recursive key sort, JSONL table extraction — compilable to WASM for VSCode"
license = "MIT"

[lib]
crate-type = [ "cdylib", "rlib" ]

[dependencies]
analyzer-core = { path = "../analyzer-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
console_error_panic_hook = "0.1"

[dev-dependencies]
pretty_assertions = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
