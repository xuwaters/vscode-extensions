[package]
name = "fast-html-data"
version = "0.1.0"
edition = { workspace = true }
description = "Static HTML/SVG element, attribute and event tables for the FAST analyzer, generated from @vscode/web-custom-data, plus a loader for VS Code custom-data JSON."
license = "MIT"

[lints]
workspace = true

[dependencies]
phf = { version = "0.13", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1"
