[package]
name = "typst-preview-core"
version = "0.1.0"
edition = { workspace = true }
description = "Per-page SVG rendering, page content hashing and diffing, cursor/click jump mapping, and SVG/PNG/TIFF export for the Typst Ultra live preview."
license = "MIT"

[lints]
workspace = true

[dependencies]
typst-session = { path = "../typst-session", default-features = false }

typst = "0.15.1"
typst-layout = "0.15.1"
typst-svg = "0.15.1"
typst-render = "0.15.1"
typst-ide = "0.15.1"
typst-syntax = "0.15.1"

ecow = "0.2"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
# For `Pixmap::encode_png`; typst-render does not re-export tiny-skia.
tiny-skia = "0.12"
# TIFF export's Deflate, and the CRC of the resolution chunk added to PNGs.
# Both are already in the graph through tiny-skia's PNG encoder.
miniz_oxide = "0.8"
crc32fast = "1"

[dev-dependencies]
typst-svg = "0.15.1"
# Re-enable the fs ports for tests: features unify, so the WASM build (which
# depends on typst-session with default-features = false) is unaffected.
typst-session = { path = "../typst-session", features = ["fs-ports"] }
typst-assets = { version = "0.15.1", features = ["fonts"] }
pretty_assertions = "1"
