[package]
name = "log-engine"
version = "0.1.0"
edition = { workspace = true }
description = "Transport-agnostic log engine — ANSI rendering, filter matching, line indexing. Reusable from WASM (log-parser), CLI tools, or out-of-process servers."
license = "MIT"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
memchr = "2"

[dev-dependencies]
pretty_assertions = "1"
