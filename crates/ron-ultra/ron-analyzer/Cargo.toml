[package]
name = "ron-analyzer"
version = "0.1.0"
edition = { workspace = true }
description = "RON (Rusty Object Notation) analyzer — lossless parser, diagnostics, comment-preserving formatter, outline, hover paths, and validation against the Rust types a file deserializes into"
license = "MIT"

[dependencies]
analyzer-core = { path = "../../analyzer-core" }
serde = { version = "1", features = [ "derive" ] }

[dev-dependencies]
pretty_assertions = "1"

[lints]
workspace = true
