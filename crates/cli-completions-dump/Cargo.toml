[package]
name = "cli-completions-dump"
version = "0.1.0"
edition = { workspace = true }
description = "Debug CLI: decode a cli-completions packed blob and dump it as JSON"
license = "MIT"

[[bin]]
name = "cli-completions-dump"
path = "src/main.rs"

[dependencies]
cli-completions = { path = "../cli-completions" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
