[package]
name = "log-parser"
version = "0.2.0"
edition = { workspace = true }
description = "WASM adapter exposing `log-engine` to the VSCode log-viewer webview/host."
license = "MIT"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
log-engine = { path = "../log-engine" }

[dev-dependencies]
pretty_assertions = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
