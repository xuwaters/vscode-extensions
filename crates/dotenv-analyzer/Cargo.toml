[package]
name = "dotenv-analyzer"
version = "0.1.0"
edition = { workspace = true }
description = "dotenv (.env) language analyzer — parser, outline, diagnostics, completion — compilable to WASM for VSCode"
license = "MIT"

[lib]
crate-type = [ "cdylib", "rlib" ]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
console_error_panic_hook = "0.1"

[dev-dependencies]
pretty_assertions = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
