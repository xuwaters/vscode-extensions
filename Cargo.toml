[workspace]
members = [
  "crates/*",
  # `crates/typst` is a grouping directory with no manifest of its own, which
  # the `crates/*` glob cannot express — hence the explicit entries plus the
  # exclude below. Explicit members override `exclude`, so the glob keeps
  # working for every other crate. New typst crates go here by hand.
  "crates/typst/typst-session",
  "crates/typst/typst-lsp-core",
  "crates/typst/typst-preview-core",
  "crates/typst/typst-lsp-wasm",
]
exclude = ["crates/typst"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.lints.clippy]
collapsible_if = "allow"
collapsible_match = "allow"

[profile.release]
opt-level = "s"
lto = true
