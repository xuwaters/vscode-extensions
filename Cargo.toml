[workspace]
members = [
  "crates/*",
  # `crates/typst`, `crates/fast` and `crates/wgsl` are grouping directories
  # with no manifest of their own, which the `crates/*` glob cannot express —
  # hence the explicit entries plus the excludes below. Explicit members
  # override `exclude`, so the glob keeps working for every other crate. New
  # crates in those three directories go here by hand.
  "crates/typst/typst-session",
  "crates/typst/typst-lsp-core",
  "crates/typst/typst-preview-core",
  "crates/typst/typst-lsp-wasm",
  "crates/fast/fast-template-syntax",
  "crates/fast/fast-html-data",
  "crates/fast/fast-analyzer-core",
  "crates/fast/fast-analyzer-wasm",
  "crates/wgsl/wgsl-syntax",
  "crates/wgsl/wgsl-lsp-core",
  "crates/wgsl/wgsl-lsp-wasm",
]
exclude = ["crates/typst", "crates/fast", "crates/wgsl"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.lints.clippy]
collapsible_if = "allow"
collapsible_match = "allow"

[profile.release]
opt-level = "s"
lto = true
